name: CI

# Runs on every pull request and push to main, and is called by deploy.yml
# before anything is shipped. One required check, "Quality gate", sums it up.
#
# What gates and what only informs:
#   gates:   the PHP test suite, Pint (code style), the frontend build and a
#            check that the build's manifest contains every entry the views ask
#            for (the missing-manifest 500 that broke the Dot.Projects login pages on 2026-10-17).
#   informs: PHPStan, composer audit and npm audit, each its own job so a red
#            one is visible by name. They are continue-on-error: a new advisory
#            or a static-analysis finding must not stop an unrelated release
#            (Dot.Agents sat red for a month when audits were blocking).
#            Promote one to the gate by adding it to the gate's `needs` once it
#            is clean and staying clean.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Pushes to
# main (and the deploy's workflow_call) are never cancelled. The group name is
# prefixed so it cannot collide with a caller's own concurrency group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP tests and code style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, sqlite3, pdo_sqlite, bcmath, gd, zip, xml, fileinfo

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test --compact

  assets:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Every @vite([...]) entry in the views must exist in the manifest, or
      # the page that uses it answers 500 (ViteException). The deploy ships
      # exactly this build, so checking it here catches the failure early.
      - name: Manifest covers every Vite entry the views use
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          manifest = json.load(open('public/build/manifest.json'))
          wanted = set()
          for view in pathlib.Path('resources/views').rglob('*.php'):
              for block in re.findall(r"@vite\(\s*\[([^\]]*)\]", view.read_text()):
                  wanted.update(re.findall(r"['\"]([^'\"]+)['\"]", block))
          problems = [f'{e} is not in the manifest' for e in sorted(wanted) if e not in manifest]
          for entry, meta in manifest.items():
              if not pathlib.Path('public/build', meta['file']).is_file():
                  problems.append(f"{entry} points at {meta['file']}, which was not built")
          print('entries the views ask for:', sorted(wanted))
          print('entries in the manifest  :', sorted(manifest))
          if not wanted:
              problems.append('no @vite entries found in resources/views; the check itself is broken')
          if problems:
              print('::error::Vite manifest problem:', problems)
              sys.exit(1)
          print('OK')
          PY

  static-php:
    name: PHPStan (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Level 5 (phpstan.neon.dist) reports findings today, mostly Eloquent
    # property types on Livewire components, so this cannot gate yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, sqlite3, pdo_sqlite, bcmath, gd, zip, xml, fileinfo

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  composer-audit:
    name: Composer audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      # Audits composer.lock only; nothing is installed.
      - name: composer audit
        run: composer audit --no-interaction

  npm-audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Red today: tailwindcss 3 -> 4 and @tailwindcss/typography are major
    # upgrades (dev-time build tooling only). Owner decision; see the PR that
    # introduced this job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Audits package-lock.json only; nothing is installed.
      - name: npm audit
        run: npm audit --audit-level=moderate

  gate:
    name: Quality gate (all checks must pass)
    runs-on: ubuntu-latest
    needs: [tests, assets, static-php, composer-audit, npm-audit]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require tests and assets to have passed
        run: |
          echo "tests:          ${{ needs.tests.result }}"
          echo "assets:         ${{ needs.assets.result }}"
          echo "phpstan:        ${{ needs.static-php.result }} (informational)"
          echo "composer audit: ${{ needs.composer-audit.result }} (informational)"
          echo "npm audit:      ${{ needs.npm-audit.result }} (informational)"
          [ "${{ needs.tests.result }}" = "success" ] && [ "${{ needs.assets.result }}" = "success" ]
